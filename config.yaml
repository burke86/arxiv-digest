digest_name: "Colin's Astronomy arXiv Digest"
researcher_name: "Colin Burke"

research_context: |
  Colin Burke studies quasars and active galactic nuclei, especially optical and UV
  variability, structure functions, damped-random-walk and related stochastic
  time-series models, accretion disks and disk-corona coupling, extreme variability
  quasars, changing-look AGN, Eddington ratios, and black-hole accretion physics.
  Core interests also include quasar X-ray properties (photon index and alpha_OX),
  reverberation mapping and continuum/inter-band lags, AGN host galaxies and selection
  effects, and intermediate-mass black holes and black-hole occupation fractions.
  Rank work on quasars as cosmological distance indicators, Hubble diagrams, H0,
  dark energy, and w0-wa cosmology highly when it connects to AGN standardisation or
  observational systematics. Also surface unusually important or closely related work
  on strong lensing, galaxy clusters and substructure, subhalo mass functions,
  self-interacting dark matter, lens-model systematics, Little Red Dots and compact
  high-redshift red AGN, Rubin/LSST time-domain science, DESI, and major surveys.
  Judge scientific relevance semantically rather than requiring literal keyword
  overlap, and allow genuinely novel adjacent work to rank highly.

